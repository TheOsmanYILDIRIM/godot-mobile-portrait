name: 🚀 Build Godot 4 Android Portrait Editor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Version Branch/Tag'
        required: true
        default: '4.3-stable'

jobs:
  build-android-editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Python 3.11 & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-godot-android-editor-v4

      - name: Clone Godot Engine
        run: |
          GODOT_TAG="${{ github.event.inputs.godot_version || '4.3-stable' }}"
          echo "Cloning Godot $GODOT_TAG..."
          git clone --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git godot-src

      - name: Patch Android Manifest & Orientation Lock to Full Sensor (Portrait Enabled)
        run: |
          cd godot-src
          echo "=== Patching Android Orientation Locks ==="
          
          # Replace all orientation locks in manifests with fullSensor
          find platform/android -name "AndroidManifest.xml" -exec sed -i 's/android:screenOrientation="sensorLandscape"/android:screenOrientation="fullSensor"/g' {} +
          find platform/android -name "AndroidManifest.xml" -exec sed -i 's/android:screenOrientation="userLandscape"/android:screenOrientation="fullSensor"/g' {} +
          find platform/android -name "AndroidManifest.xml" -exec sed -i 's/android:screenOrientation="landscape"/android:screenOrientation="fullSensor"/g' {} +
          
          # Patch Java/Kotlin code if any orientation is hardcoded
          find platform/android -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/SCREEN_ORIENTATION_SENSOR_LANDSCAPE/SCREEN_ORIENTATION_FULL_SENSOR/g' {} +
          find platform/android -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/SCREEN_ORIENTATION_USER_LANDSCAPE/SCREEN_ORIENTATION_FULL_SENSOR/g' {} +
          find platform/android -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/SCREEN_ORIENTATION_LANDSCAPE/SCREEN_ORIENTATION_FULL_SENSOR/g' {} +

          echo "=== Verifying Patched Manifests ==="
          grep -rn "screenOrientation" platform/android/ || true

      - name: Compile Godot Android Editor Core (arm64-v8a)
        run: |
          cd godot-src
          scons platform=android target=editor arch=arm64 module_mono_enabled=no use_ccache=yes -j$(nproc)

      - name: Build Android Editor APK with Gradle
        run: |
          cd godot-src/platform/android/java
          ./gradlew assembleEditorDebug --stacktrace

      - name: Collect Output APKs
        run: |
          mkdir -p artifacts
          find godot-src/bin -name "*.apk" -exec cp {} artifacts/ \;
          find godot-src/platform/android/java/editor/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot4-Android-Portrait-Editor-APK
          path: artifacts/*.apk
          retention-days: 14
