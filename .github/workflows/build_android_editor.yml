name: 🚀 Build Godot 4 Embedded Mobile Portrait APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Version Tag (e.g. 4.3-stable)'
        required: true
        default: '4.3-stable'

jobs:
  build-embedded-mobile-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-godot-embedded-portrait

      - name: Clone Upstream Godot Source
        run: |
          GODOT_TAG="${{ github.event.inputs.godot_version || '4.3-stable' }}"
          echo "Cloning Godot Engine $GODOT_TAG..."
          git clone --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git godot-src

      - name: Configure Clone App Identity & Unlock Orientation
        run: |
          cd godot-src
          echo "=== 1. Setting Unique Package ID (Side-by-side Clone Mode) ==="
          # Replace package/applicationId in Gradle scripts so it installs ALONGSIDE original Godot
          find platform/android -name "build.gradle" -exec sed -i 's/org\.godotengine\.editor\.v4/org.godotengine.godot.portrait/g' {} +
          find platform/android -name "build.gradle" -exec sed -i 's/org\.godotengine\.editor\.v3/org.godotengine.godot.portrait/g' {} +
          find platform/android -name "build.gradle" -exec sed -i 's/applicationId "org.godotengine.editor"/applicationId "org.godotengine.godot.portrait"/g' {} +
          find platform/android -name "build.gradle" -exec sed -i 's/applicationId "org.godotengine.godot"/applicationId "org.godotengine.godot.portrait"/g' {} +

          echo "=== 2. Setting App Name to 'Godot Portrait' ==="
          find platform/android -name "strings.xml" -exec sed -i 's/<string name="godot_editor_name">.*<\/string>/<string name="godot_editor_name">Godot Portrait<\/string>/g' {} +
          find platform/android -name "strings.xml" -exec sed -i 's/<string name="godot_project_name">.*<\/string>/<string name="godot_project_name">Godot Portrait<\/string>/g' {} +

          echo "=== 3. Unlocking Android Screen Orientation (Full Sensor in Manifests ONLY) ==="
          find platform/android -name "AndroidManifest.xml" -exec sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="fullSensor"/g' {} +

          echo "=== 4. Embedding Default Mobile Theme & Touch DPI Settings ==="
          if [ -f "editor/editor_settings.cpp" ]; then
            sed -i 's/_initial_set("interface\/touchscreen\/enable_pan_and_scale_gestures", false)/_initial_set("interface\/touchscreen\/enable_pan_and_scale_gestures", true)/g' editor/editor_settings.cpp || true
          fi

          echo "=== Verification ==="
          grep -rn "org.godotengine.godot.portrait" platform/android/ || true
          grep -rn "Godot Portrait" platform/android/ || true
          grep -rn "screenOrientation" platform/android/ || true

      - name: Compile Godot Engine Android Editor Library (arm64-v8a)
        run: |
          cd godot-src
          scons platform=android target=editor arch=arm64 module_mono_enabled=no use_ccache=yes -j$(nproc)

      - name: Build Standalone Godot Android Editor APK
        run: |
          cd godot-src/platform/android/java
          ./gradlew assembleEditorDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output_apk
          find godot-src/bin -name "*.apk" -exec cp {} output_apk/ \;
          find godot-src/platform/android/java/editor/build/outputs/apk -name "*.apk" -exec cp {} output_apk/ \; || true
          ls -la output_apk/

      - name: Upload Godot Mobile Portrait APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot4-Mobile-Portrait-Clone-APK
          path: output_apk/*.apk
          retention-days: 30
